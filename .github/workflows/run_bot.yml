name: AI Gold & FX Self-Evolving Bot

on:
  schedule:
    # 毎時0分に自動実行（平日は分析＆LINE通知、土日は週末集中学習を実行）
      - cron: '0 */2 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-generativeai

      - name: Run Gold & FX AI Bot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python gold_mac_bot.py

      - name: Commit updated trade_log and ai_evolution
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add trade_log.json ai_evolution.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update trade log and AI evolution rules" && git push)
